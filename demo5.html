<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Layout</title>
</head>
<body>

  <div style="background-color: rgb(185, 215, 226); padding: 20px; text-align: center; height: 80px;">
    <h2 style="color: rgb(12, 12, 12);">Header</h2>
    
  </div>

  <div style="display: flex; height: calc(100vh - 160px);">

    <div style="background-color: rgb(147, 104, 118); width: 200px; padding: 20px;">
      <h2 style="color: aliceblue;">Sidebar</h2>
      
    </div>

    <div style="flex: 1; display: flex; flex-direction: column;">

      <div style="flex: 1; background-color: rgb(236, 129, 129); padding: 15px;">
        <h2 style="color: aliceblue;">ifram availabel</h2>
        <center>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/f491j0yUTRY?si=xZ4N7EERbVa9acNB" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </center>

      </div>

      <div style="flex: 1; background-color: rgb(226, 130, 225); padding: 15px;">
        <h2 style="color: aliceblue;"> audio availabel</h2>
        <audio controls>
            <source src ="Thani Oruvan - Masstamilan.mp3"type="audio/mpeg">
            Your browser does not support the audio tag
        </audio>
      </div>

    </div>
  </div>

  <div style="background-color: rgb(195, 132, 87); text-align: center; padding: 15px; height: 80px;">
    <h2 style="color: aliceblue;">Footer</h2>
  </div>

</body>
</html>
